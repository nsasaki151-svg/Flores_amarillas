<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No me olvidé de tus flores amarillas 🌻</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #080a1e;
    font-family: Georgia, 'Times New Roman', serif;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .titulo, .mensaje {
    position: fixed;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    padding: 0 20px;
  }
  .titulo {
    top: 5vh;
    color: #fff5c2;
    font-size: clamp(1.1rem, 3.8vw, 2.4rem);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(255,220,120,.9), 0 3px 8px rgba(120,60,0,.6);
    animation: brilloPulso 3s ease-in-out infinite;
  }
  .mensaje {
    bottom: 6vh;
    color: #fffbe6;
    font-size: clamp(.9rem, 2.4vw, 1.35rem);
    font-style: italic;
    text-shadow: 0 0 14px rgba(255,220,120,.7), 0 2px 6px rgba(120,60,0,.6);
  }
  .visible { 
    opacity: 1; 
    transform: translateX(-50%) translateY(0);
  }
  
  @keyframes brilloPulso {
    0%, 100% { text-shadow: 0 0 18px rgba(255,220,120,.9), 0 3px 8px rgba(120,60,0,.6); }
    50% { text-shadow: 0 0 28px rgba(255,230,140,1), 0 3px 12px rgba(120,60,0,.8); }
  }

  .btn-musica {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    background: rgba(255, 245, 194, 0.15);
    border: 2px solid rgba(255, 245, 194, 0.4);
    color: #fff5c2;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    opacity: 0;
    pointer-events: none;
  }
  .btn-musica.visible {
    opacity: 1;
    pointer-events: all;
  }
  .btn-musica:hover {
    background: rgba(255, 245, 194, 0.3);
    transform: scale(1.1);
  }
  .btn-musica:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="titulo" id="titulo">NO CREAS QUE ME OLVIDE DE TUS FLORES AMARILLAS</div>
<div class="mensaje" id="mensaje">Para la persona más especial: que nunca te falten motivos para sonreír 🌻</div>
<button class="btn-musica" id="btnMusica" title="Música">♪</button>

<script>
/* =========================================================
   CONFIGURACIÓN — PERSONALIZA AQUÍ
   ========================================================= */
const CONFIG = {
  fondoNoche:    "#080a1e",
  fondoAmanecer: "#ffd27a",
  estrella:      "#fff0a0",
  estrellaBrillo:"#fffff0",
  sol:           "#ffd75a",
  solHalo:       "rgba(255,180,60,0.35)",
  tallo:         "#3c7832",
  hoja:          "#50a03c",
  coloresFlores: ["#ffd700", "#ffeb78", "#ffbe1e", "#faf996", "#f0c828"],
  centroFlor:    "#b47814",
  duracionLluvia:   4.5,
  duracionAmanecer: 3.0,
  duracionRamo:     3.0,
  titulo: "NO CREAS QUE ME OLVIDE DE TUS FLORES AMARILLAS",
  mensaje:"Para la persona más especial: que nunca te falten motivos para sonreír 🌻",
  numEstrellas: 160,
};
/* ========================================================= */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ---------- Utilidades ----------
const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

function hexToRgb(hex) {
  const m = hex.replace('#','');
  const n = parseInt(m.length===3 ? m.split('').map(c=>c+c).join('') : m, 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}

// ---------- MÚSICA: Rondó Caprichoso Intro ----------
class PianoRondo {
  constructor() {
    this.audioCtx = null;
    this.gainNode = null;
    this.isPlaying = false;
    this.isMuted = false;
    this.currentNote = 0;
    this.startTime = 0;
    
    // Intro de Rondó Caprichoso Op. 28 - Saint-Saëns
    // Adaptación para piano solo, La menor
    // Notas: A3, E4, A4, C5, E5, A5... con rubato
    this.melodia = [
      {nota: 220.00, dur: 0.6, vel: 0.3}, // A3
      {nota: 329.63, dur: 0.4, vel: 0.35}, // E4
      {nota: 440.00, dur: 0.8, vel: 0.4},  // A4
      {nota: 523.25, dur: 0.4, vel: 0.45}, // C5
      {nota: 659.25, dur: 0.4, vel: 0.5},  // E5
      {nota: 880.00, dur: 1.2, vel: 0.55}, // A5
      {nota: 659.25, dur: 0.4, vel: 0.45}, // E5
      {nota: 523.25, dur: 0.4, vel: 0.4},  // C5
      {nota: 440.00, dur: 0.8, vel: 0.35}, // A4
      {nota: 493.88, dur: 0.3, vel: 0.4},  // B4
      {nota: 523.25, dur: 0.3, vel: 0.45}, // C5
      {nota: 587.33, dur: 1.0, vel: 0.5},  // D5
      {nota: 659.25, dur: 0.5, vel: 0.55}, // E5
      {nota: 587.33, dur: 0.5, vel: 0.5},  // D5
      {nota: 523.25, dur: 0.5, vel: 0.45}, // C5
      {nota: 493.88, dur: 1.5, vel: 0.4},  // B4
    ];
    this.loopPoint = 0;
  }

  init() {
    if (this.audioCtx) return;
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    this.gainNode = this.audioCtx.createGain();
    this.gainNode.connect(this.audioCtx.destination);
    this.gainNode.gain.value = 0;
  }

  tocarNota(freq, duracion, velocity, tiempo) {
    const osc = this.audioCtx.createOscillator();
    const gainNota = this.audioCtx.createGain();
    const filter = this.audioCtx.createBiquadFilter();
    
    osc.type = 'triangle'; // Más cercano a piano
    osc.frequency.value = freq;
    
    // Filtro para suavizar el timbre
    filter.type = 'lowpass';
    filter.frequency.value = 2000;
    filter.Q.value = 1;
    
    // Envelope ADSR para simular piano
    const attack = 0.01;
    const decay = 0.1;
    const sustain = velocity * 0.6;
    const release = duracion * 0.7;
    
    gainNota.gain.setValueAtTime(0, tiempo);
    gainNota.gain.linearRampToValueAtTime(velocity, tiempo + attack);
    gainNota.gain.linearRampToValueAtTime(sustain, tiempo + attack + decay);
    gainNota.gain.setValueAtTime(sustain, tiempo + duracion - release);
    gainNota.gain.linearRampToValueAtTime(0, tiempo + duracion);
    
    osc.connect(filter);
    filter.connect(gainNota);
    gainNota.connect(this.gainNode);
    
    osc.start(tiempo);
    osc.stop(tiempo + duracion + 0.1);
  }

  play() {
    if (this.isPlaying) return;
    this.init();
    this.isPlaying = true;
    this.startTime = this.audioCtx.currentTime;
    this.scheduleNotes();
    
    // Fade in general
    this.gainNode.gain.cancelScheduledValues(this.audioCtx.currentTime);
    this.gainNode.gain.setValueAtTime(this.isMuted ? 0 : 0, this.audioCtx.currentTime);
    this.gainNode.gain.linearRampToValueAtTime(this.isMuted ? 0 : 0.15, this.audioCtx.currentTime + 2);
  }

  scheduleNotes() {
    if (!this.isPlaying) return;
    
    let tiempo = this.audioCtx.currentTime + 0.1;
    const melodiaLength = this.melodia.length;
    
    for (let i = 0; i < melodiaLength * 2; i++) {
      const nota = this.melodia[i % melodiaLength];
      const rubato = 0.95 + Math.random() * 0.1; // Rubato sutil
      this.tocarNota(nota.nota, nota.dur * rubato, nota.vel, tiempo);
      tiempo += nota.dur * rubato;
    }
    
    // Re-agendar antes de que termine
    setTimeout(() => this.scheduleNotes(), (tiempo - this.audioCtx.currentTime - 2) * 1000);
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.gainNode) {
      this.gainNode.gain.cancelScheduledValues(this.audioCtx.currentTime);
      this.gainNode.gain.linearRampToValueAtTime(
        this.isMuted ? 0 : 0.15, 
        this.audioCtx.currentTime + 0.3
      );
    }
    return this.isMuted;
  }
}

const piano = new PianoRondo();
let musicaIniciada = false;

// ---------- Estrellas ----------
class Estrella {
  constructor() { this.reset(true); }
  reset(inicial=false) {
    this.x = Math.random() * W;
    this.y = inicial ? Math.random() * H : -Math.random()*200 - 20;
    this.z = 0.3 + Math.random()*0.7;
    this.vel = (60 + Math.random()*80) * this.z;
    this.tam = (1.5 + Math.random()*3) * this.z;
    this.parpadeo = Math.random()*Math.PI*2;
    this.parpadeoVel = 1 + Math.random()*2;
  }
  update(dt, extra=0) {
    this.y += (this.vel + extra*100) * dt;
    this.parpadeo += this.parpadeoVel * dt;
    if (this.y > H + 20) { this.reset(); }
    if (this.z < 0.05) this.z = 0.05;
  }
  draw() {
    const brillo = 0.6 + 0.4*Math.sin(this.parpadeo);
    const r = this.tam * brillo;
    if (r < 0.5) return;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r*3);
    g.addColorStop(0, 'rgba(255,240,160,0.55)');
    g.addColorStop(1, 'rgba(255,240,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, r*3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = CONFIG.estrellaBrillo;
    ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.6, r), 0, Math.PI*2); ctx.fill();
  }
}

// ---------- Flores ----------
class Flor {
  constructor(cx, cy, radio, color, petalos) {
    this.cx = cx; this.cy = cy;
    this.radio = radio;
    this.color = color;
    this.petalos = petalos;
    this.angulo = Math.random()*Math.PI*2;
  }
  draw(alpha=1, escala=1) {
    const r = this.radio * escala;
    if (r < 1 || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < this.petalos; i++) {
      const a = this.angulo + i * (Math.PI*2/this.petalos);
      const px = this.cx + Math.cos(a) * r * 0.8;
      const py = this.cy + Math.sin(a) * r * 0.8;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = this.color;
      ctx.beginPath(); ctx.arc(px, py, r*0.75, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 8;
    ctx.shadowColor = CONFIG.centroFlor;
    ctx.fillStyle = CONFIG.centroFlor;
    ctx.beginPath(); ctx.arc(this.cx, this.cy, r*0.55, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ---------- Construcción del ramo ----------
let flores = [];
function construirRamo() {
  flores = [];
  const baseX = W/2;
  const baseY = H*0.72;
  const escala = Math.min(W,H) / 750;
  const posiciones = [
    [-140,-10,34],[-70,-90,40],[0,-130,46],[70,-90,40],[140,-10,34],
    [-110,60,34],[-30,40,38],[60,50,38],[130,70,32],[0,-30,50]
  ];
  posiciones.forEach((p,i) => {
    const color = CONFIG.coloresFlores[i % CONFIG.coloresFlores.length];
    const petalos = [6,7,8][i % 3];
    flores.push(new Flor(baseX + p[0]*escala, baseY + p[1]*escala, p[2]*escala, color, petalos));
  });
  return { baseX, baseY, escala, posiciones };
}
let ramoInfo = construirRamo();
window.addEventListener('resize', () => { ramoInfo = construirRamo(); });

function dibujarTallos(alpha) {
  if (alpha <= 0) return;
  const { baseX, baseY, escala, posiciones } = ramoInfo;
  const baseTalloY = H*0.88;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = CONFIG.tallo;
  ctx.lineWidth = 5*escala;
  ctx.lineCap = 'round';
  posiciones.forEach(p => {
    const ex = baseX + p[0]*escala;
    const ey = baseY + p[1]*escala;
    ctx.beginPath();
    ctx.moveTo(baseX, baseTalloY);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    const mx = (baseX+ex)/2, my = (baseTalloY+ey)/2;
    ctx.fillStyle = CONFIG.hoja;
    ctx.beginPath();
    ctx.ellipse(mx, my, 12*escala, 6*escala, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

// ---------- Animación principal ----------
const estrellas = Array.from({length: CONFIG.numEstrellas}, () => new Estrella());
let tiempo = 0;
let last = performance.now();

const elTitulo = document.getElementById('titulo');
const elMensaje = document.getElementById('mensaje');
const btnMusica = document.getElementById('btnMusica');
elTitulo.textContent = CONFIG.titulo;
elMensaje.textContent = CONFIG.mensaje;

btnMusica.addEventListener('click', () => {
  if (!musicaIniciada) {
    piano.play();
    musicaIniciada = true;
  }
  const muted = piano.toggleMute();
  btnMusica.textContent = muted ? '♪̸' : '♪';
});

// Iniciar música con primer click en cualquier lado
document.body.addEventListener('click', () => {
  if (!musicaIniciada) {
    piano.play();
    musicaIniciada = true;
    btnMusica.classList.add('visible');
  }
}, { once: true });

function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  tiempo += dt;

  const pAmanecer = tiempo > CONFIG.duracionLluvia*0.3
    ? Math.min(1, (tiempo - CONFIG.duracionLluvia*0.3) / CONFIG.duracionAmanecer)
    : 0;
  const pRamo = tiempo > CONFIG.duracionLluvia*0.6
    ? Math.min(1, (tiempo - CONFIG.duracionLluvia*0.6) / CONFIG.duracionRamo)
    : 0;

  ctx.fillStyle = lerpColor(CONFIG.fondoNoche, CONFIG.fondoAmanecer, easeInOut(pAmanecer));
  ctx.fillRect(0, 0, W, H);

  if (pAmanecer > 0) {
    const solY = lerp(H + 200, H*0.65, easeOut(pAmanecer));
    const g = ctx.createRadialGradient(W/2, solY, 20, W/2, solY, 500);
    g.addColorStop(0, CONFIG.solHalo);
    g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = CONFIG.sol;
    ctx.beginPath(); ctx.arc(W/2, solY, 90, 0, Math.PI*2); ctx.fill();
  }

  const enLluvia = tiempo < CONFIG.duracionLluvia;
  const extra = enLluvia ? 2 + 4*(tiempo/CONFIG.duracionLluvia) : 1;
  estrellas.forEach(e => {
    e.update(dt, extra);
    if (!enLluvia) e.z *= 0.99;
    e.draw();
  });

  if (pRamo > 0) dibujarTallos(Math.min(1, pRamo*1.4));
  
  flores.forEach((f, i) => {
    const retraso = i/flores.length * 0.5;
    const p = Math.max(0, Math.min(1, (pRamo - retraso) / (1 - retraso + 1e-6)));
    const escala = easeOut(p) * (1 + 0.05*Math.sin(tiempo*3 + i));
    const alpha = p;
    if (p > 0 && p < 1) {
      const r = 80 * (1-p);
      const g = ctx.createRadialGradient(f.cx, f.cy, 0, f.cx, f.cy, r);
      g.addColorStop(0, `rgba(255,255,220,${0.6*(1-p)})`);
      g.addColorStop(1, 'rgba(255,255,220,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.cx, f.cy, r, 0, Math.PI*2); ctx.fill();
    }
    f.draw(alpha, escala);
  });

  if (pAmanecer > 0.2) {
    elTitulo.classList.add('visible');
    btnMusica.classList.add('visible');
  }
  if (pRamo > 0.4) elMensaje.classList.add('visible');

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
